# Publish the latest version (site/) to GitHub Pages on every push to main that touches it.
# Only the pages and their assets are published — build sources (src/, package*.json), docs, tools and archive/ are not.
# Two jobs (GitHub's starter pattern): "build" uploads the artifact, "deploy" publishes it. A separate deploy job starts
# after the upload is fully registered — a single job once failed with "No artifacts named github-pages were found".
# To redeploy, start a new run (Actions → Run workflow); re-running only the failed deploy job is fine, re-running
# the build job adds a second artifact with the same name.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the published files
        run: |
          mkdir _site
          cp -r site/index.html site/harga.html site/app.html site/assets _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
